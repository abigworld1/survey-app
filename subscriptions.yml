# 分野設定（自分専用）。分野ごとに username(URLスラッグ) / label(表示名) / keywords / k / sources を指定。
#  - username: 公開URL（/survey-app/<username>/）になる ASCII スラッグ。実名・PIIは入れない。
#  - label:    トップや一覧に表示される日本語の分野名。
#  - keywords: ソース横断の検索語（OR検索）。
#  - search_queries: 取得用の検索語。指定すると keywords ではなくこちらで検索する。
#  - k:        1日に生成するページ数の上限（最大 2）。
#  - sources:  arxiv / openalex / semanticscholar / dblp から選択。
subscriptions:
  - username: mapf-mapd-warehouse
    label: 自動倉庫におけるマルチエージェント計画・タスク形成最適化
    keywords:
      - "Multi-Agent Path Finding"
      - "Multi-Agent Pathfinding"
      - "MAPF"
      - "Multi-Agent Pickup and Delivery"
      - "MAPD"
      - "MT-MAPD"
      - "Lifelong Multi-Agent Path Finding"
      - "Online Multi-Agent Path Finding"
    search_queries:
      - "Multi-Agent Path Finding"
      - "Multi-Agent Pathfinding"
      - "Multi-Agent Pickup and Delivery"
      - "Multi-Task Multi-Agent Pickup and Delivery"
      - "Lifelong Multi-Agent Path Finding"
      - "Online Multi-Agent Path Finding"
    # MAPF/MAPD は他分野でも使われるため、略語だけの一致には下記の文脈を必須にする。
    ambiguous_keywords:
      - "MAPF"
      - "MAPD"
    # 略称だけが一致した場合に必須とする語の組。内側はAND、外側はOR。
    ambiguous_context_groups:
      MAPF:
        - ["path", "finding"]
        - ["pathfinding"]
      MAPD:
        - ["pickup", "delivery"]
    context_keywords:
      - "Multi-Agent"
      - "Multi Agent"
      - "Path Finding"
      - "Pathfinding"
      - "Pickup and Delivery"
      - "Pickup-and-Delivery"
      - "Task Assignment"
      - "Task Allocation"
      - "Collision-Free"
      - "Path Planning"
      - "Multi-Robot"
      - "Multi Robot"
      - "Robot"
      - "Warehouse"
    k: 2
    sources: [arxiv, semanticscholar, openalex]

  - username: doc-structure-rag
    label: 文書構造解析に基づく検索・質問応答・RAG
    archived: true  # 過去のURLと履歴だけ保持。取得・要約しない。

  # 以前の手動追加記事を保持（日次取得なし。現在の新規追加先はMAPFのみ）。
  - username: reading
    label: 個別に読んだ論文
    manual: true
