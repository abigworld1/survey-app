name: Daily MAPF survey

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '候補と本文だけ取得（Copilot・commit・Pages更新なし）'
        type: boolean
        default: true
      publish_only:
        description: '既存記事だけを公開（新規取得・Copilotなし、dry_runはfalseにする）'
        type: boolean
        default: false
  schedule:
    - cron: '0 21 * * *' # 06:00 JST, preserving the previous daily schedule

permissions: {}
concurrency:
  group: survey-daily-pages
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo
  PYTHONUNBUFFERED: '1'

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      copilot-requests: write
    outputs:
      base_sha: ${{ steps.baseline.outputs.sha }}
      pipeline_status: ${{ steps.pipeline.outputs.status }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Record baseline
        id: baseline
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax and unit tests
        run: |
          python -m compileall -q pipeline tests ask.py add-pdfs.py
          python -m unittest discover -s tests -q
      - uses: actions/setup-node@v6
        if: ${{ !inputs.dry_run && !inputs.publish_only }}
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install latest Copilot CLI
        if: ${{ !inputs.dry_run && !inputs.publish_only }}
        run: |
          npm install -g @github/copilot
          copilot --version
      - name: Daily discovery and summarization
        id: pipeline
        timeout-minutes: 30
        continue-on-error: true # A timeout must still allow verified checkpoints to be staged.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
          COPILOT_MODEL: ${{ vars.COPILOT_MODEL }}
        shell: bash
        run: |
          set +e
          if [[ "$PUBLISH_ONLY" == "true" && "$DRY_RUN" == "true" ]]; then
            echo 'dry_run + publish_only: no discovery or writes'
          elif [[ "$PUBLISH_ONLY" == "true" ]]; then
            python -m pipeline.run --render-indexes-only
          elif [[ "$DRY_RUN" == "true" ]]; then
            bash deploy/run-daily.sh --dry-run
          else
            bash deploy/run-daily.sh
          fi
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Pipeline exit status: $status (0=success/no eligible papers; 2=reported failure)" >> "$GITHUB_STEP_SUMMARY"
          # Save verified checkpoints even if a later paper failed. Never retry LLM.
          exit 0
      - name: Stage and validate durable results
        if: ${{ !inputs.dry_run }}
        run: python -m pipeline.publish stage "$RUNNER_TEMP/survey-results"
      - name: Retain recovery artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: survey-results
          path: ${{ runner.temp }}/survey-results
          retention-days: 30
          if-no-files-found: error
      - name: Report dry run errors
        if: ${{ inputs.dry_run && steps.pipeline.outputs.status != '0' }}
        run: exit 1

  publish:
    needs: generate
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.generate.outputs.base_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: survey-results
          path: ${{ runner.temp }}/survey-results
      - name: Apply and validate results
        run: python -m pipeline.publish apply "$RUNNER_TEMP/survey-results"
      - name: Commit and push durable history
        run: python -m pipeline.publish push "$RUNNER_TEMP/survey-results"
      - name: Build static site from persisted history
        run: python -m pipeline.publish build "$RUNNER_TEMP/pages"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages
          include-hidden-files: true

  deploy:
    needs: [generate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Surface partial pipeline failures after preserving good articles
        if: needs.generate.outputs.pipeline_status != '0'
        run: |
          echo '::error::Paper pipeline reported a failure. See generate logs; verified history was saved. No automatic Copilot retry.'
          exit 1
